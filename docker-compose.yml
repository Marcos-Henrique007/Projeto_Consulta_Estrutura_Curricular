services:
  postgres:
    image: postgres:17
    container_name: tads_postgres
    environment:
      POSTGRES_DB: tads
      POSTGRES_USER: tads
      POSTGRES_PASSWORD: tads_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tads -d tads"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    container_name: tads_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5
    container_name: tads_neo4j
    environment:
      NEO4J_AUTH: neo4j/tads_dev_123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
